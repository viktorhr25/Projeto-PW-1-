<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>Sistema que não sei o nome</title>
    <link rel="stylesheet" href="css/servcss.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>

  <body>
    <header
      class="topo py-3 px-4 d-flex justify-content-between align-items-center"
    >
      <strong>SQNSN</strong>
      <nav>
        <ul class="nav nav-pills" >
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="servico.html"  >Serviços</a></li>
          <li class="nav-item"><a class="nav-link "href="clientes.html">Clientes</a></li>
          <li class="nav-item"><a class="nav-link" href="ordem.html" > Ordens de serviço</a></li>
      </ul>
      </nav>
    </header>

    <main class="container-fluid p-4">
      <div class="row g-4">
        <section class="col-lg-8">
          <div class="cartao">
            <div class="px-4 pt-3 border-bottom">
              <span class="aba-ativa d-inline-block">
                Ordens de serviço <span class="contador" id="contador">0</span>
              </span>
            </div>

            <table class="table table-hover mb-0 tabela-servicos">
              <thead>
                <tr>
                  <th class="ps-4">Cliente</th>
                  <th>Bicicleta</th>
                  <th>Serviço</th>
                  <th class="text-end">Valor</th>
                  <th class="text-end pe-4">Ações</th>
                </tr>
              </thead>
              <tbody id="tabela"></tbody>
            </table>

            <div
              class="px-4 py-3 border-top text-secondary small"
              id="rodape"
            ></div>
          </div>
        </section>

        <aside class="col-lg-4">
          <div class="cartao p-4">
            <div class="d-flex align-items-center gap-2 mb-1">
              <span class="icone-form">+</span>
              <h5 class="mb-0">Nova ordem de serviço</h5>
            </div>
            <p class="text-secondary small border-bottom pb-3"></p>

            <form id="formOS" onsubmit="salvarOS(event)">
              <div class="mb-3">
                <label class="form-label">Cliente *</label>
                <div id="listaClientes"></div>
                <select
                  class="form-select mt-2"
                  id="cliente"
                  onchange="listarClientes()"
                >
                  <option value="">Selecione um cliente</option>
                </select>

              <div class="mb-3">
                <label for="bicicleta" class="form-label"
                  >Bicicleta (nome/modelo) *</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="bicicleta"
                  placeholder="Ex.: 29 oggi rosa"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Serviços *</label>
                <div id="listaServicos"></div>
                <select
                  class="form-select mt-2"
                  id="servico"
                  onchange="listarServicos()"
                >

                  <option value="">Selecione um serviço</option>
                </select>
                
              </div>

              <div class="d-flex justify-content-between fw-bold mb-4">
                <span>Total</span>
                <span id="total">R$ 0,00</span>
              </div>

              <button type="submit" class="btn btn-verde w-100 py-2"
                  id="btnSalvar">
                Salvar ordem
              </button>
              <button
                type="button"
                class="btn btn-outline-secondary w-100 mt-2"
                onclick="limparForm()"
              >
                Limpar
              </button>
            </form>
          </div>
        </aside>
      </div>
    </main>

    <footer class="px-4 pb-3">
      <a
        href="https://drive.google.com/file/d/1ylhFZQAvUDRVdmB8-LkAt4ZZd2TmN20t/view?usp=sharing"
        >documentação</a
      >
      <p>© 2026 projeto pw1 Viktor Regert.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="java/funcgeral.js"></script>
    <script src="java/indexjs.js"></script>
   
  </body>
</html>
