<body>
    
     <h1>Serviços</h1>

    <table class="table table-striped table-hover ">
        <thead class="table-dark">
            <tr>
                <th>Nome</th>
                <th>Preço</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela">
            <tr>
                <td>Celular</td>
                <td>2000</td>
                <td><button class="btn bg-danger text-white" onclick="excluirServ()">Excluir Servico</button></td>
                <td><button class="btn bg-danger text-white" onclick="buscarServForm()">Alterar Servico</button></td>
            </tr>
    </table>
    <form class="container">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" required>
        </div>

        <div class="mb-3">
            <label for="preco" class="form-label">Preço</label>
            <input type="numeric" class="form-control" id="preco" required>
        </div>
        <button type="submit" class="btn btn-primary" onclick="adicionarServ(nome.value, preco.value);
        alert('Servico Adicionado!')">Adicionar</button>
    </form>
</body>

        document.getElementById("tabela").innerHTML = listarServicos();
