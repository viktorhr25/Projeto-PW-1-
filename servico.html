<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>Document</title>
    <link rel="stylesheet" href="css/servcss.css" />
  </head>

  <body>
    <header
      class="topo py-3 px-4 d-flex justify-content-between align-items-center"
    >
      <strong>SQNSN</strong>
      <nav>
        <a href="index.html">Home</a>
        <a href="servico.html">Serviços</a>
      </nav>
    </header>

    <main class="container-fluid p-4">
      <div class="row g-4">
        <section class="col-lg-8">
          <div class="cartao">
            <div class="px-4 pt-3 border-bottom">
              <span class="aba-ativa d-inline-block">
                Todos os serviços <span class="contador" id="contador">0</span>
              </span>
            </div>

            <table class="table table-hover mb-0 tabela-servicos">
              <thead>
                <tr>
                  <th class="ps-4">Serviço</th>
                  <th class="text-end">Valor</th>
                  <th class="text-end pe-4">Ações</th>
                </tr>
              </thead>
              <tbody id="tabela"></tbody>
            </table>

            <div
              class="px-4 py-3 border-top text-secondary small"
              id="rodape"
            ></div>
          </div>
        </section>

        <aside class="col-lg-4">
          <div class="cartao p-4">
            <div class="d-flex align-items-center gap-2 mb-1">
              <span class="icone-form">+</span>
              <h5 class="mb-0" id="tituloForm">Adicionar serviço</h5>
            </div>
            <p class="text-secondary small border-bottom pb-3"></p>

            <form id="formServico" onsubmit="salvarServ(event)">
              <div class="mb-3">
                <label for="nome" class="form-label">Nome do serviço *</label>
                <input
                  type="text"
                  class="form-control"
                  id="nome"
                  placeholder="Ex.: Regulagem de freio"
                  required
                />
              </div>

              <div class="mb-4">
                <label for="valor" class="form-label">Valor *</label>
                <div class="input-group">
                  <span class="input-group-text">R$</span>
                  <input
                    type="number"
                    min="0"
                    step="any"
                    class="form-control"
                    id="valor"
                    placeholder="0,00"
                    required
                  />
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-verde w-100 py-2"
                id="btnSalvar"
              >
                Adicionar
              </button>
              <button
                type="button"
                class="btn btn-outline-secondary w-100 mt-2"
                onclick="limparForm()"
              >
                Limpar
              </button>
            </form>
          </div>
        </aside>
      </div>
    </main>

    <script src="java/servjs.js"></script>
  </body>
</html>
