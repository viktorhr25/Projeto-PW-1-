<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>Clientes</title>
    <link rel="stylesheet" href="css/servcss.css" />
  </head>

  <body>
    <header
      class="topo py-3 px-4 d-flex justify-content-between align-items-center"
    >
      <strong>SQNSN</strong>
      <nav>
        <ul class="nav nav-pills" >
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="servico.html"  >Serviços</a></li>
          <li class="nav-item"><a class="nav-link active" href="clientes.html">Clientes</a></li>
          <li class="nav-item"><a class="nav-link" href="ordem.html" > Ordens de serviço</a></li>
      </ul>
      </nav>
    </header>

    <main class="container-fluid p-4">
      <div class="row g-4">
        <section class="col-lg-8">
          <div class="cartao">
            <div class="px-4 pt-3 border-bottom">
              <span class="aba-ativa d-inline-block">
                Todos os clientes <span class="contador" id="contador">0</span>
              </span>
            </div>

            <table class="table table-hover mb-0 tabela-servicos">
              <thead>
                <tr>
                  <th class="ps-4">ID</th>
                  <th>Nome</th>
                  <th>Telefone</th>
                  <th class="text-end pe-4">Ações</th>
                </tr>
              </thead>
              <tbody id="tabela"></tbody>
            </table>

            <div
              class="px-4 py-3 border-top text-secondary small"
              id="rodape"
            ></div>
          </div>
        </section>

        <aside class="col-lg-4">
          <div class="cartao p-4">
            <div class="d-flex align-items-center gap-2 mb-1">
              <span class="icone-form">+</span>
              <h5 class="mb-0" id="tituloForm">Adicionar cliente</h5>
            </div>
            <p class="text-secondary small border-bottom pb-3"></p>

            <form id="formCliente" onsubmit="salvarCliente(event)">
              <div class="mb-3">
                <label for="nome" class="form-label">Nome *</label>
                <input type="text" class="form-control" id="nome" required />
              </div>

              <div class="mb-4">
                <label for="telefone" class="form-label">Telefone *</label>
                <input
                  type="text"
                  class="form-control"
                  id="telefone"
                  placeholder="(00) 00000-0000"
                  required
                />
              </div>

              <button
                type="submit"
                class="btn btn-verde w-100 py-2"
                id="btnSalvar"
              >
                Adicionar
              </button>
              <button
                type="button"
                class="btn btn-outline-secondary w-100 mt-2"
                onclick="limparForm()"
              >
                Limpar
              </button>
            </form>
          </div>
        </aside>
      </div>
      <div class="modal fade" id="modalServicos" tabindex="-1">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="tituloServicos"></h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <table class="table mb-0">
                <thead>
                  <tr>
                    <th>Serviço</th>
                    <th>Bicicleta</th>
                    <th class="text-end">Valor</th>
                  </tr>
                </thead>
                <tbody id="tabelaServicos"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <sxcript src="java/funcgeral.js"></script>
    <script src="java/clientejs.js"></script>
  </body>
</html>
